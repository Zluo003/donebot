name: DoneBot Cloud images

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Cloud node platform
        required: true
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/arm64

permissions:
  contents: read

concurrency:
  group: donebot-cloud-images-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PLATFORM: ${{ inputs.platform }}
      CLOUD_REVISION: cea625e81fe5f74fb4317e1d3b8837478f6e2710
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Zluo003/DoneBot-Cloud
          ref: ${{ env.CLOUD_REVISION }}
          path: cloud-verification
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Prepare isolated verification
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          npm ci --prefix cloud-verification
          npm test --prefix cloud-verification
          sudo apt-get update -qq
          sudo apt-get install -y nftables e2fsprogs util-linux
          sudo env PATH="$PATH" CLOUD_DISPOSABLE_LINUX=1 node cloud-verification/scripts/verify-egress-host.mjs
          echo "IMAGE_BUNDLE=$RUNNER_TEMP/donebot-cloud-images" >> "$GITHUB_ENV"
      - name: Build API service and graphical desktop
        run: |
          set -euo pipefail
          mkdir -p "$IMAGE_BUNDLE/desktop"
          node cloud-verification/scripts/desktop-dockerfile.mjs "$PWD" "$IMAGE_BUNDLE/desktop/Dockerfile"
          docker build --platform "$IMAGE_PLATFORM" --target cloud-service --label "org.opencontainers.image.revision=$GITHUB_SHA" --iidfile "$IMAGE_BUNDLE/service.iid" .
          docker build --platform "$IMAGE_PLATFORM" --label "org.opencontainers.image.revision=$GITHUB_SHA" --iidfile "$IMAGE_BUNDLE/desktop.iid" "$IMAGE_BUNDLE/desktop"
          printf 'CLOUD_DONEBOT_IMAGE=%s\nCLOUD_DESKTOP_IMAGE=%s\n' "$(cat "$IMAGE_BUNDLE/service.iid")" "$(cat "$IMAGE_BUNDLE/desktop.iid")" > "$IMAGE_BUNDLE/agent-images.env"
      - name: Verify API-only image contract
        run: |
          set -euo pipefail
          source "$IMAGE_BUNDLE/agent-images.env"
          container="dbc-contract-$GITHUB_RUN_ID"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" "$CLOUD_DONEBOT_IMAGE"
          for attempt in $(seq 1 60); do
            if docker exec "$container" curl -sf http://127.0.0.1:18899/api/health > "$IMAGE_BUNDLE/health.json"; then break; fi
            sleep 1
          done
          jq -e '.static == false' "$IMAGE_BUNDLE/health.json"
          docker exec "$container" test ! -e /app/dist/index.html
          docker exec "$container" test -s /app/dist-server/donebot/image-worker.js
          test "$(docker exec "$container" curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18899/)" = 404
          docker exec "$container" curl -sf http://127.0.0.1:18899/api/donebot/mobile/status > "$IMAGE_BUNDLE/mobile-status.json"
          jq -e 'has("authenticated") and has("registered") and has("relay")' "$IMAGE_BUNDLE/mobile-status.json"
      - name: Verify native Linux service, network and desktop isolation
        run: |
          set -euo pipefail
          source "$IMAGE_BUNDLE/agent-images.env"
          sudo env PATH="$PATH" CLOUD_DISPOSABLE_LINUX=1 CLOUD_DONEBOT_IMAGE="$CLOUD_DONEBOT_IMAGE" node cloud-verification/scripts/verify-linux.mjs | tee "$IMAGE_BUNDLE/linux-verification.jsonl"
          sudo env PATH="$PATH" CLOUD_DISPOSABLE_LINUX=1 CLOUD_DONEBOT_IMAGE="$CLOUD_DONEBOT_IMAGE" node cloud-verification/scripts/verify-egress.mjs | tee "$IMAGE_BUNDLE/egress-verification.jsonl"
          sudo env PATH="$PATH" CLOUD_DISPOSABLE_LINUX=1 CLOUD_DONEBOT_IMAGE="$CLOUD_DONEBOT_IMAGE" CLOUD_DESKTOP_IMAGE="$CLOUD_DESKTOP_IMAGE" node cloud-verification/scripts/verify-desktop.mjs | tee "$IMAGE_BUNDLE/desktop-verification.jsonl"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified immutable images
        run: |
          set -euo pipefail
          source "$IMAGE_BUNDLE/agent-images.env"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="sha-$GITHUB_SHA-${IMAGE_PLATFORM#linux/}"
          service="ghcr.io/$owner/donebot-cloud-service"
          desktop="ghcr.io/$owner/donebot-cloud-desktop"
          docker tag "$CLOUD_DONEBOT_IMAGE" "$service:$tag"
          docker tag "$CLOUD_DESKTOP_IMAGE" "$desktop:$tag"
          docker push "$service:$tag"
          docker push "$desktop:$tag"
          service_digest=$(docker image inspect "$service:$tag" | jq -er --arg prefix "$service@sha256:" '.[0].RepoDigests | map(select(startswith($prefix))) | first')
          desktop_digest=$(docker image inspect "$desktop:$tag" | jq -er --arg prefix "$desktop@sha256:" '.[0].RepoDigests | map(select(startswith($prefix))) | first')
          printf 'CLOUD_DONEBOT_IMAGE=%s\nCLOUD_DESKTOP_IMAGE=%s\n' "$service_digest" "$desktop_digest" > "$IMAGE_BUNDLE/registry-images.env"
          jq -n --arg revision "$GITHUB_SHA" --arg cloud "$CLOUD_REVISION" --arg platform "$IMAGE_PLATFORM" --arg service "$service_digest" --arg desktop "$desktop_digest" --arg run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{source_revision:$revision,cloud_revision:$cloud,platform:$platform,service_target:"cloud-service",static:false,registry:{service:$service,desktop:$desktop},run:$run}' > "$IMAGE_BUNDLE/published-manifest.json"
          cat "$IMAGE_BUNDLE/registry-images.env" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloud-images-${{ inputs.platform == 'linux/arm64' && 'arm64' || 'amd64' }}-${{ github.sha }}
          path: |
            ${{ env.IMAGE_BUNDLE }}/published-manifest.json
            ${{ env.IMAGE_BUNDLE }}/registry-images.env
            ${{ env.IMAGE_BUNDLE }}/*-verification.jsonl
            ${{ env.IMAGE_BUNDLE }}/health.json
            ${{ env.IMAGE_BUNDLE }}/mobile-status.json
          if-no-files-found: error
          retention-days: 14
