name: donebot-mobile-relay
services:
  relay:
    image: ${RELAY_IMAGE:-donebot-relay:local}
    network_mode: host
    env_file: relay.env
    environment:
      RELAY_HOST: 127.0.0.1
      RELAY_PORT: "18080"
      RELAY_MOBILE_CLIENTS: "1"
      RELAY_GATEWAY_ORIGIN: https://donebot.cn
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 3g
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    healthcheck:
      test: [CMD, /nodejs/bin/node, -e, "fetch('http://127.0.0.1:18080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
